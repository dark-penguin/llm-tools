name: Go binaries only

env:
  GO_VERSION: "1.25"

on:
  push:
    tags:  # v*** to publish, v***-<anything> - prerelease
      - v*
    branches:  # For tags, publish them; for normal commits, just build and test
      - master
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Check that Actions workflows are the same except some lines commented out
      run: |
        # Add '-u' to see more lines around the changes
        echo -e "\nOffending differences:\n======================"
        if diff \
          <(sed -E 's/^(\s*)# ?/\1/' .gitea/workflows/go-build.yml) \
          <(sed -E 's/^(\s*)# ?/\1/' .github/workflows/go-build.yml)
        then echo "None"
        else echo -e "\eWorkflows are different!"; exit 1
        fi
        echo -e "\nAllowed differences:\n===================="
        diff .gitea/workflows/go-build.yml .github/workflows/go-build.yml || true

  build:
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast: false  # With this, one failed platform does not abort others
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-amd64.tgz
            format: tar
          - os: windows-latest
            suffix: windows-amd64.zip
            format: zip
          - os: macos-latest
            suffix: darwin-amd64.tgz
            format: tar

    steps:
    - name: "DEBUG: dump context variables"
      run: |
        echo "github.ref        = ${{ github.ref }}"
        echo "github.ref_type   = ${{ github.ref_type }}"
        echo "github.ref_name   = ${{ github.ref_name }}"
        echo "github.event_name = ${{ github.event_name }}"
        echo "github.base_ref   = ${{ github.base_ref }}"
        echo "github.head_ref   = ${{ github.head_ref }}"
        echo "github.api_url    = ${{ github.api_url }}"

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: "${{ env.GO_VERSION }}"
        cache: true

    - name: Test
      run: make test

    - name: Build
      run: make build

    - name: Archive (Linux/Mac)
      if: matrix.format == 'tar'
      run: |
        REPO_NAME="${GITHUB_REPOSITORY#*/}"                     # Strip owner name
        echo "REPO_NAME=${REPO_NAME}" | tee -a "${GITHUB_ENV}"  # Save into env-file (NO '' HERE!)
        cd bin && tar zcvf ../${REPO_NAME}-${{ matrix.suffix }} *

    - name: Archive (Windows)
      if: matrix.format == 'zip'
      run: |
        $repo = $env:GITHUB_REPOSITORY.Split('/')[-1]  # Strip owner name
        "REPO_NAME=$repo" >> $env:GITHUB_ENV           # Save into env-file
        cd bin && powershell Compress-Archive -Path * -DestinationPath "../$repo-${{ matrix.suffix }}"

    # This will automatically zip the files before uploading!
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.REPO_NAME }}-${{ matrix.suffix }}.zip
        path: ${{ env.REPO_NAME }}-${{ matrix.suffix }}
        retention-days: 1
        if-no-files-found: error


  release:
    if: github.ref_type == 'tag'  # For tags, publish them; for normal commits, just build and test

    needs: build
    runs-on: ubuntu-latest

    permissions:  # Restrict the release job to only "contents" just in case (optional)
      contents: write

    steps:
    - name: Checkout code  # For the changelogs!
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Default: 1 (--depth 1); we need history for changelogs!

    - name: Generate release notes
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.ref_name }}^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          git log --oneline "${PREV_TAG}..${{ github.ref_name }}" > NOTES.md  # Changes since last tag
        else
          git log --oneline ${{ github.ref_name }} > NOTES.md  # Only current commit headline
        fi
        echo -e "\n= = =\nRelease notes:\n-------------"
        cat NOTES.md

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist/
        # Automatically extracts files into './dist/myproject-linux-amd64.tar.gz.zip/myproject-linux-amd64.tar.gz' !

    - name: Move artifacts
      run: |
        # echo -e "\nROOT DIRECTORY:\n==============="; ls -lha
        cd dist
        # echo -e "\nDIST DIRECTORY:\n==============="; ls -lha
        echo -e "\nDIST DIRECTORY:\n==============="; ls -lha *
        for i in * ; do mv "$i"/* . ; rmdir "$i"; done

    - name: Publish release
      uses: softprops/action-gh-release@v3.0.4
      env:
        GITHUB_API_URL: ${{ github.api_url }}
      with:
        token: ${{ github.token }}
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        files: ./dist/*
        # generate_release_notes: true  # Not supported by Gitea!
        body_path: NOTES.md
        prerelease: ${{ contains(github.ref_name, '-') }}  # true - mark the release as a prerelease
        # draft: true  # Save the release as a draft instead of publishing it
